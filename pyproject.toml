[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-iot"
version = "0.1.0"
description = "Hermes-native WebRTC IoT gateway for embedded voice devices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiortc>=1.9.0",
  "deepgram-sdk>=4.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "numpy>=1.26.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "PyYAML>=6.0.2",
  "uvicorn>=0.32.0",
  "websockets>=15.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
hermes-iot-gateway = "hermes_iot_gateway.app:main"
hermes-iot-sim = "hermes_iot_gateway.simulator:main"
hermes-iot-setup = "hermes_iot_gateway.bootstrap:main"
hermes-iot-doctor = "hermes_iot_gateway.doctor:main"
hermes-iot-install-plugin = "hermes_iot_gateway.installer:main"
hermes-iot-install-native = "hermes_iot_gateway.native_install:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway/src/hermes_iot_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"gateway/src/hermes_iot_gateway/web" = "hermes_iot_gateway/web"

[tool.pytest.ini_options]
testpaths = ["gateway/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
